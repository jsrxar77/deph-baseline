<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body, html {
    width: 1080px; height: 1920px;
    background: #000;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Outfit", "Inter", "Avenir Next", "Helvetica Neue", sans-serif;
  }
  #root {
    position: relative;
    width: 1080px;
    height: 1920px;
  }
  #bg {
    position: absolute;
    inset: 0;
    width: 1080px;
    height: 1920px;
    object-fit: cover;
  }
  #subscribe {
    position: absolute;
    top: 240px;
    left: 75px;
    display: inline-flex;
    align-items: center;
    gap: 12px;
    background: #e60000;
    color: #fff;
    font-weight: 700;
    font-size: 24px;
    letter-spacing: 0.04em;
    padding: 13px 26px;
    border-radius: 9999px;
    text-transform: uppercase;
    box-shadow: 0 4px 20px rgba(230, 0, 0, 0.55);
    z-index: 10;
  }
  #subscribe .play {
    width: 0; height: 0;
    border-top: 8px solid transparent;
    border-bottom: 8px solid transparent;
    border-left: 13px solid #fff;
  }

  /* YouTube Shorts Safe Zone compliant cards:
     - Centered horizontally, max-width 780px (leaves >150px clear of right-side action buttons)
     - Vertically constrained between y=220px and y=1400px (leaves bottom 520px clear of channel info)
     - Authentic glassmorphism: blur(24px) saturate(160%)
  */
  .glass-card {
    position: absolute;
    background: rgba(20, 16, 45, 0.65);
    backdrop-filter: blur(24px) saturate(160%);
    -webkit-backdrop-filter: blur(24px) saturate(160%);
    border: 1.5px solid rgba(255, 255, 255, 0.18);
    box-shadow: 0 14px 44px rgba(0, 0, 0, 0.5);
    border-radius: 28px;
    opacity: 0;
    text-align: center;
    z-index: 5;
  }

  #opening-card {
    top: 480px;
    left: 50%;
    transform: translateX(-50%);
    width: 780px;
    padding: 40px 48px;
  }
  .card-label {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: #a594fd;
    margin-bottom: 12px;
  }
  .card-title {
    font-size: 44px;
    font-weight: 800;
    line-height: 1.22;
    text-transform: uppercase;
    color: #ffffff;
    letter-spacing: 0.02em;
  }
  .card-sub {
    font-size: 28px;
    font-weight: 500;
    color: #b4c5e7;
    margin-top: 14px;
    line-height: 1.3;
  }

  #caption-card {
    top: 1060px;
    left: 50%;
    transform: translateX(-50%);
    max-width: 760px;
    width: fit-content;
    padding: 26px 40px;
    font-size: 40px;
    font-weight: 700;
    line-height: 1.32;
    color: #f4f2ff;
  }
  .hl {
    color: #d68bff;
    font-weight: 800;
    text-shadow: 0 0 22px rgba(214, 139, 255, 0.65);
  }

  #closing-card {
    top: 740px;
    left: 50%;
    transform: translateX(-50%);
    width: 780px;
    padding: 42px 48px;
  }
</style>
</head>
<body>
  <div id="root">
    <video id="bg" src="/video.mp4" muted playsinline></video>
    <div id="subscribe"><span class="play"></span>SUBSCRIBE</div>
    
    <div id="opening-card" class="glass-card">
      <div class="card-label">GNOSIS</div>
      <div class="card-title">FREE OR TRAPPED?</div>
      <div class="card-sub">Two Faces of the Same Energy</div>
    </div>

    <div id="caption-card" class="glass-card"></div>

    <div id="closing-card" class="glass-card">
      <div class="card-label">EXPERIENCE GNOSIS</div>
      <div class="card-title">FULL 12-MINUTE PIECE ON CHANNEL</div>
      <div class="card-sub">And if this moved something in you, leave a comment and subscribe.</div>
    </div>
  </div>

  <script>
    const opening = document.getElementById('opening-card');
    const caption = document.getElementById('caption-card');
    const closing = document.getElementById('closing-card');
    const bg = document.getElementById('bg');

    const cardsData = [{"textHtml":"What if being free and being trapped were just two faces of the same <span class=\"hl\">energy</span>?","start":0.9,"end":6.14},{"textHtml":"One is <span class=\"hl\">perpetual</span> flow:","start":6.5,"end":8.5},{"textHtml":"<span class=\"hl\">untamed</span>, with no edges to hold it back.","start":8.58,"end":11.5},{"textHtml":"The other is <span class=\"hl\">contained</span> form:","start":11.78,"end":13.94},{"textHtml":"<span class=\"hl\">rebuilding</span> itself again and again, trying to integrate.","start":14.02,"end":17.62},{"textHtml":"Sound <span class=\"hl\">guides</span> the shape.","start":18.34,"end":19.78},{"textHtml":"Every pulse at 432 Hz <span class=\"hl\">transforms</span> this image in real time.","start":20.26,"end":25.22},{"textHtml":"And, for one instant, the conflict <span class=\"hl\">disappears</span>.","start":25.7,"end":28.9},{"textHtml":"Does everything <span class=\"hl\">converge</span> into a single light?","start":29.46,"end":32.42},{"textHtml":"Finish creating this <span class=\"hl\">experience</span> in your mind.","start":32.9,"end":35.62},{"textHtml":"If this moved something in you, leave a comment and <span class=\"hl\">subscribe</span> for more pieces like this.","start":35.94,"end":41.06}];

    function updateState(t) {
      // Opening card
      if (t >= 0.4 && t <= 4.2) {
        let op = 1;
        if (t < 0.4 + 0.3) op = (t - 0.4) / 0.3;
        else if (t > 4.2 - 0.3) op = (4.2 - t) / 0.3;
        opening.style.opacity = Math.max(0, Math.min(1, op));
      } else {
        opening.style.opacity = 0;
      }

      // Closing card
      if (t >= 41 && t <= 45.4) {
        let op = 1;
        if (t < 41 + 0.3) op = (t - 41) / 0.3;
        else if (t > 45.4 - 0.3) op = (45.4 - t) / 0.3;
        closing.style.opacity = Math.max(0, Math.min(1, op));
      } else {
        closing.style.opacity = 0;
      }

      // Dynamic captions
      const active = cardsData.find(c => t >= c.start && t < c.end);
      if (active) {
        if (caption.innerHTML !== active.textHtml) {
          caption.innerHTML = active.textHtml;
        }
        let op = 1;
        if (t < active.start + 0.18) op = (t - active.start) / 0.18;
        else if (t > active.end - 0.18) op = (active.end - t) / 0.18;
        caption.style.opacity = Math.max(0, Math.min(1, op));
      } else {
        caption.style.opacity = 0;
      }
    }

    window.updateFrame = async function(t) {
      bg.currentTime = t;
      await new Promise(r => {
        bg.onseeked = () => { updateState(t); r(); };
        setTimeout(() => { updateState(t); r(); }, 400);
      });
    };
  </script>
</body>
</html>
