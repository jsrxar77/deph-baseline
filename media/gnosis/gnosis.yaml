name: gnosis
title: Gnosis
created: 2026-10-20
key: D:dorian # Tuned to A4 = 432 Hz
tempo:
  cpm: 30 # 1 cycle = 2s (120 BPM in 4/4)
arc: # gnosis-live.strudel's real structure (the approved sound domain, see domains.sound below) — half the
     # original 24:00 Ableton source's proportions, not that source's own arc (kept as a separate, untouched file)
  - { name: pleroma, cycles: 60 }          # 0:00 - 2:00 (Sophia alone)
  - { name: descent, cycles: 75 }          # 2:00 - 4:30 (the Demiurge enters, true alternation)
  - { name: density, cycles: 90 }          # 4:30 - 7:30 (shorter turns, darkest harmony)
  - { name: transcendence, cycles: 75 }    # 7:30 - 10:00 (his farewell, her rise, the Shepard flight)
  - { name: peace, cycles: 60 }            # 10:00 - 12:00 (one last pedal, then silence)
total_cycles: 360 # 720s = 12:00 exact
domains:
  sound:
    status: done # 360/360 cycles, 11 layers, approved by the user ("esta versio si esta aprobada") — see gnosis.md.
      # file is gnosis-live.strudel, not gnosis.strudel: that's the separate, untouched 720-cycle Ableton-oriented
      # source (see its own header comment) — this piece's real sound domain is the self-contained live version.
    file: sounds/gnosis-live.strudel
    source: strudel
  visual:
    status: in-progress # 2026-10-25: two particle clouds (Sofía cyan/high, Demiurgo violet/low), each bouncing inside
      # its own rotating wireframe cube — three.js's own buffergeometry-drawrange example, re-verified from source
      # (r=800 box, group.rotation.y = time*0.1, the demo's own maxConnections cap) with one necessary departure:
      # closed-form triangle-wave bounce instead of velocity integration, since Remotion can render frames out of
      # order/in parallel. Each cloud also has its own intra-cloud constellation, not just the cross-cloud one. A
      # second, slow, subtle X tilt was added on top of the source's Y spin (the user's direction: real 3D tumble,
      # not a flat turntable). The Shepard IS the integration of the two clouds — during its two windows (preludio,
      # flight) they're pulled toward a shared midpoint and the connecting lines (plus any particle caught in one)
      # shift to a third color belonging to neither cloud; the source demo's own connection cap keeps that zone
      # legible instead of saturating to a blob. Wired to the real rendered audio (gnosis-master.wav). Custom point
      # shader (soft circular sprites) replaces the default PointsMaterial. Not yet done: per-note audio-reactive
      # detail from frames.json (currently only the envelope/timeline-driven presence curves react), and the deph
      # signature ring layer (shader-only so far; the-field/musica-universalis skip it too). See gnosis.md's "Visual
      # Concept" for the full writeup. The visuals/index.html HyperFrames engine (media/gnosis/hyperframes-exploration/)
      # is a separate, unrelated full-landscape exploration — see the deph-shorts skill for the real Shorts convention.
    framework: remotion # the channel deliverable
    entry: media/gnosis/visuals/gnosis.tsx # real files, see CLAUDE.md's golden rule (tools vs. pieces)
  sync:
    status: done # audio.wav (726.0s, rendered 2026-10-25), audio-master.wav (-16 LUFS), frames.json + manifest.json
      # all generated from gnosis-live.strudel and copied into tools/visuals/public/.
    output: sync/
  daw:
    status: done # full 8-channel MIDI arrangement deployed into Ableton via the ableton MCP server; Live Set now lives in daw/ (moved from a stray sibling ableton/ folder to match this project's standing convention)
    template: "Strudel Temaplte.als"
    channels: 8
    guide: gnosis.ableton.md
    project: "daw/gnosis Project/gnosis.als"
    tracks:
      - channel: 1
        name: "Primordial Drone"
        vst_source: "Surge XT"
        preset_uri: "query:Plugins#VST3:Surge%20Synth%20Team:Surge%20XT"
        preset_category: "Basses"
        preset_name: "Eighties Drone"
      - channel: 2
        name: "Grounding Sub"
        vst_source: "Surge XT"
        preset_uri: "query:Plugins#VST3:Surge%20Synth%20Team:Surge%20XT"
        preset_category: "Basses"
        preset_name: "Sub 1"
      - channel: 3
        name: "Sophia Motif"
        vst_source: "Serum 2"
        preset_uri: "query:Plugins#VST3:Xfer%20Records:Serum%202"
        preset_category: "Factory/Bell"
        preset_name: "BL - Zenatrope 02"
      - channel: 4
        name: "Pleroma Pad"
        vst_source: "Serum 2"
        preset_uri: "query:Plugins#VST3:Xfer%20Records:Serum%202"
        preset_category: "Factory/Pad"
        preset_name: "PD - Analog Soft Cotton"
      - channel: 5
        name: "Tintinnabuli"
        vst_source: "Surge XT"
        preset_uri: "query:Plugins#VST3:Surge%20Synth%20Team:Surge%20XT"
        preset_category: "Pads"
        preset_name: "Harmonic Sweep"
      - channel: 6
        name: "Astral Textures"
        vst_source: "Serum 2"
        preset_uri: "query:Plugins#VST3:Xfer%20Records:Serum%202"
        preset_category: "Factory/Soundscape"
        preset_name: "SC - Astral Projection"
      - channel: 7
        name: "Theta Binaural"
        vst_source: "Audio Stem"
        preset_name: "07-theta-binaural.wav"
      - channel: 8
        name: "Warm Voice (Counterpoint)"
        vst_source: "Serum 2"
        preset_uri: "query:Plugins#VST3:Xfer%20Records:Serum%202"
        preset_category: "Factory/Pad"
        preset_name: "LD - Analog Glow (Cello Filtered)"
    master_chain:
      - device: "EQ Eight"
        settings: "High Pass 48dB @ 25 Hz, Bell dip @ 320 Hz (-1.2 dB), High Shelf @ 11.5 kHz (+0.8 dB)"
      - device: "Glue Compressor"
        settings: "Ratio 2:1, Attack 30ms, Release Auto, Output +0.5 dB"
      - device: "Limiter"
        settings: "Ceiling -1.0 dBTP, Mode True Peak, Lookahead 6ms, Release Auto"
publish:
  status: planned
  file: gnosis.youtube.md
doc: gnosis.md
