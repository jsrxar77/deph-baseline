  - { name: descent, cycles: 150 }         # 4:00 - 9:00 (Emanation of Sophia & First Dialogue)
  - { name: density, cycles: 180 }         # 9:00 - 15:00 (The Polyphonic Weave & Modal Counterpoint)
  - { name: grounding, cycles: 150 }       # 15:00 - 20:00 (The Earthing Rod / Full Integration)
  - { name: transfiguration, cycles: 120 } # 20:00 - 24:00 (Gradual Deconstruction & Return to Silence)
total_cycles: 720 # 1440s = 24:00 exact (Deep meditative transport)
