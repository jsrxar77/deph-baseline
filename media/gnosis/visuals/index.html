<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Gnosis — HyperFrames Visual Composition</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #050508;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    #root {
      position: relative;
      width: 3840px;
      height: 2160px;
      background: radial-gradient(circle at 50% 50%, #0d1322 0%, #050508 75%, #020204 100%);
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    
    /* Background Ambience & Sacred Grid */
    .cosmic-grid {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: 
        radial-gradient(circle at 50% 50%, rgba(56, 189, 248, 0.05) 1px, transparent 1px),
        radial-gradient(circle at 50% 50%, rgba(245, 158, 11, 0.03) 1px, transparent 1px);
      background-size: 80px 80px, 160px 160px;
      opacity: 0.7;
    }

    /* Central Axis — The Grounding Rod (La Varilla de Tierra de Sophía) */
    .grounding-axis {
      position: absolute;
      width: 4px;
      height: 100%;
      background: linear-gradient(180deg, 
        rgba(56, 189, 248, 0.9) 0%, 
        rgba(125, 211, 252, 0.8) 35%, 
        rgba(251, 191, 36, 0.85) 65%, 
        rgba(245, 158, 11, 0.95) 100%);
      box-shadow: 0 0 40px rgba(56, 189, 248, 0.6), 0 0 80px rgba(245, 158, 11, 0.4);
    }

    /* Sacred Rings of Sophia */
    .sophia-rings {
      position: absolute;
      width: 1200px;
      height: 1200px;
      pointer-events: none;
    }
    .ring {
      position: absolute;
      top: 50%;
      left: 50%;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      border: 1.5px solid rgba(56, 189, 248, 0.25);
      box-shadow: 0 0 30px rgba(56, 189, 248, 0.15);
    }
    .ring-1 { width: 300px; height: 300px; border-color: rgba(251, 191, 36, 0.5); }
    .ring-2 { width: 600px; height: 600px; border-color: rgba(56, 189, 248, 0.35); }
    .ring-3 { width: 900px; height: 900px; border-color: rgba(245, 158, 11, 0.25); }
    .ring-4 { width: 1200px; height: 1200px; border-color: rgba(56, 189, 248, 0.15); }

    /* Central Core / Sophia's Spark */
    .central-core {
      position: absolute;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: radial-gradient(circle, #ffffff 0%, #38bdf8 40%, #0369a1 80%, transparent 100%);
      box-shadow: 0 0 60px #38bdf8, 0 0 120px rgba(56, 189, 248, 0.8);
    }

    /* Typography / Minimal Brand & Gnosis Indicator */
    .hud-header {
      position: absolute;
      top: 120px;
      left: 140px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .hud-title {
      font-size: 42px;
      font-weight: 300;
      letter-spacing: 0.25em;
      color: #f8fafc;
      text-transform: uppercase;
    }
    .hud-subtitle {
      font-size: 18px;
      font-weight: 400;
      letter-spacing: 0.15em;
      color: #38bdf8;
      text-transform: uppercase;
    }
    .hud-facts {
      position: absolute;
      bottom: 120px;
      left: 140px;
      font-size: 16px;
      letter-spacing: 0.15em;
      color: rgba(248, 250, 252, 0.6);
      text-transform: uppercase;
    }
    .phase-badge {
      position: absolute;
      top: 120px;
      right: 140px;
      font-size: 20px;
      letter-spacing: 0.2em;
      color: #fbbf24;
      text-transform: uppercase;
      padding: 8px 24px;
      border: 1px solid rgba(251, 191, 36, 0.3);
      border-radius: 9999px;
      background: rgba(13, 19, 34, 0.6);
      backdrop-filter: blur(10px);
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
</head>
<body>
  <div id="root" data-composition-id="gnosis">
    <div class="cosmic-grid"></div>
    
    <!-- Central Grounding Axis -->
    <div class="grounding-axis" id="groundingAxis"></div>

    <!-- Sophia Sacred Geometry Rings -->
    <div class="sophia-rings" id="sophiaRings">
      <div class="ring ring-4" id="ring4"></div>
      <div class="ring ring-3" id="ring3"></div>
      <div class="ring ring-2" id="ring2"></div>
      <div class="ring ring-1" id="ring1"></div>
      <div class="central-core" id="core"></div>
    </div>

    <!-- HUD & Editorial Typography -->
    <div class="hud-header">
      <div class="hud-title">GNOSIS</div>
      <div class="hud-subtitle">Sophia · Grounding Rod Architecture</div>
    </div>
    
    <div class="phase-badge" id="phaseBadge">I. Pleroma</div>

    <div class="hud-facts">
      432 Hz Calibration · Theta 6 Hz Binaural · 640 Cycles
    </div>
  </div>

  <script>
    // HyperFrames GSAP Master Timeline
    // Duration: 1280 seconds (21:20 exact) at 60 fps = 76,800 frames
    const compositionId = 'gnosis';
    const totalDuration = 1280; // seconds

    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    window.__timelines[compositionId] = tl;

    // Phase Markers (Arc sync):
    // 0:00 - 3:12 (0 - 192s): Pleroma
    // 3:12 - 7:28 (192 - 448s): Descent
    // 7:28 - 12:48 (448 - 768s): Density
    // 12:48 - 18:08 (768 - 1088s): Grounding
    // 18:08 - 21:20 (1088 - 1280s): Transfiguration

    // Continuous Sacred Breathing (Cycles across the 21:20 duration)
    tl.to('#ring1', { scale: 1.4, duration: 8, ease: 'sine.inOut', repeat: Math.floor(totalDuration / 8), yoyo: true }, 0);
    tl.to('#ring2', { scale: 1.25, duration: 16, ease: 'sine.inOut', repeat: Math.floor(totalDuration / 16), yoyo: true }, 0);
    tl.to('#ring3', { scale: 1.15, duration: 24, ease: 'sine.inOut', repeat: Math.floor(totalDuration / 24), yoyo: true }, 0);
    tl.to('#ring4', { scale: 1.08, duration: 32, ease: 'sine.inOut', repeat: Math.floor(totalDuration / 32), yoyo: true }, 0);
    tl.to('#core', { scale: 1.6, boxShadow: '0 0 100px #38bdf8, 0 0 200px rgba(56, 189, 248, 0.9)', duration: 4, ease: 'sine.inOut', repeat: Math.floor(totalDuration / 4), yoyo: true }, 0);

    // Phase Transitions:
    tl.set('#phaseBadge', { textContent: 'I. Pleroma' }, 0);
    tl.set('#phaseBadge', { textContent: 'II. Descent' }, 192);
    tl.set('#phaseBadge', { textContent: 'III. Density' }, 448);
    tl.set('#phaseBadge', { textContent: 'IV. Grounding (Climax)' }, 768);
    tl.set('#phaseBadge', { textContent: 'V. Transfiguration' }, 1088);

    // Macro Intensity Progression:
    tl.to('#groundingAxis', {
      boxShadow: '0 0 80px rgba(56, 189, 248, 0.9), 0 0 160px rgba(245, 158, 11, 0.8)',
      width: '8px',
      duration: 320,
      ease: 'power2.inOut'
    }, 448); // Grounding build

    tl.to('#groundingAxis', {
      boxShadow: '0 0 30px rgba(56, 189, 248, 0.4), 0 0 60px rgba(245, 158, 11, 0.3)',
      width: '4px',
      duration: 192,
      ease: 'power2.out'
    }, 1088); // Transfiguration resolution
  </script>
</body>
</html>
